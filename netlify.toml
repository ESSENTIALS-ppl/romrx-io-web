# ROMRx corporate, Netlify config
[build]
  publish = "."
  functions = "netlify/functions"
  # Build the HQ React app into app/dist/ (Vite base='/app/').
  # Marketing HTML at repo root is served as-is.
  command = "cd app && npm install && npm run build"

# HQ React app static asset passthrough. Serves /app/assets/*, /app/index.html etc.
# directly from app/dist/. This must come BEFORE the SPA fallback below.
[[redirects]]
  from = "/app/assets/*"
  to = "/app/dist/assets/:splat"
  status = 200

[[redirects]]
  from = "/app/favicon.ico"
  to = "/app/dist/favicon.ico"
  status = 200

# SPA fallback: any /app/* URL that isn't a static asset falls back to the
# built index.html so react-router-dom handles the route.
# Two rules: bare /app (no slash) and /app/*. The bare /app rule must come
# first because Netlify would otherwise serve the raw app/index.html from
# the repo root due to publish=".".
[[redirects]]
  from = "/app"
  to = "/app/dist/index.html"
  status = 200

[[redirects]]
  from = "/app/"
  to = "/app/dist/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/dist/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Pretty URLs, allow /investors instead of /investors.html
[[redirects]]
  from = "/investors"
  to = "/investors.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/universe"
  to = "/universe.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/platform"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/science"
  to = "/science.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/ambassador"
  to = "/ambassador.html"
  status = 200

# The public cohort/waitlist assessment page is retired. Send every direct or
# historical request straight to the Base signup funnel. force = true so this
# fires even if a stale /assessment.html is ever restored to the publish dir.
[[redirects]]
  from = "/assessment"
  to = "/app/signup"
  status = 301
  force = true

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/bjj"
  to = "/bjj.html"
  status = 200

[[redirects]]
  from = "/bodybuilding"
  to = "/bodybuilding.html"
  status = 200

# /bb is a short alias that redirects to the +BodyBuilding landing page.
[[redirects]]
  from = "/bb"
  to = "/bodybuilding"
  status = 301
