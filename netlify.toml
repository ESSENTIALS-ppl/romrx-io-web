# ROMRx corporate, Netlify config
[build]
  publish = "."
  functions = "netlify/functions"
  # Build the HQ React app into app/dist/ (Vite base='/app/').
  # Marketing HTML at repo root is served as-is.
  # rm app/index.html after build so publish="." cannot serve Vite /src/main.tsx
  # for /app/ (Field RISK 2026-09-08). Local Vite still has its own index.
  command = "cd app && npm install && npm run build && rm -f index.html"

# HQ React app static asset passthrough. Serves /app/assets/* from app/dist/.
# This must come BEFORE the SPA fallback below.
[[redirects]]
  from = "/app/assets/*"
  to = "/app/dist/assets/:splat"
  status = 200

[[redirects]]
  from = "/app/favicon.ico"
  to = "/app/dist/favicon.ico"
  status = 200

# SPA entry: force=true overrides any static app/index.html left in publish.
# Without force, Netlify serves repo app/index.html (Vite /src/main.tsx) for
# /app and /app/ ahead of redirects — Field RISK 2026-09-08.
[[redirects]]
  from = "/app"
  to = "/app/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/app/"
  to = "/app/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/app/index.html"
  to = "/app/dist/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/app/*"
  to = "/app/dist/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Article library. Hub at /articles, articles at /articles/<slug>.
# Real files (index.html, feed.xml) are served directly by Netlify before
# these rewrites apply; only slug paths with no static file are rewritten.
[[redirects]]
  from = "/articles"
  to = "/articles/index.html"
  status = 200

[[redirects]]
  from = "/articles/*"
  to = "/articles/:splat.html"
  status = 200

# Pretty URLs, allow /investors instead of /investors.html
[[redirects]]
  from = "/investors"
  to = "/investors.html"
  status = 200

[[redirects]]
  from = "/partners"
  to = "/partners.html"
  status = 200

[[redirects]]
  from = "/universe"
  to = "/universe.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/platform"
  to = "/dashboard.html"
  status = 301

[[redirects]]
  from = "/science"
  to = "/science.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/ambassador"
  to = "/ambassador.html"
  status = 200

# The public cohort/waitlist assessment page is retired. Send every direct or
# historical request straight to the Base signup funnel. force = true so this
# fires even if a stale /assessment.html is ever restored to the publish dir.
[[redirects]]
  from = "/assessment"
  to = "/app/signup"
  status = 301
  force = true

[[redirects]]
  from = "/legal"
  to = "/legal.html"
  status = 200

[[redirects]]
  from = "/bjj"
  to = "/bjj.html"
  status = 200

[[redirects]]
  from = "/bodybuilding"
  to = "/bodybuilding.html"
  status = 200

# /bb is a short alias that redirects to the +BodyBuilding landing page.
[[redirects]]
  from = "/bb"
  to = "/bodybuilding"
  status = 301
